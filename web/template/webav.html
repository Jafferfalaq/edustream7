<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{template_ne}} | {{file_name}}</title>
  <link rel="icon" href="https://i.ibb.co.com/wZSFb93q/6233177219853388617.jpg" type="image/x-icon" />
  <meta name="description" content="Stream high-quality videos and movies in 1080p. Experience seamless playback with multiple player options." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.8.3/plyr.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #00f0ff;
      --accent-blue: #3498db;
      --bg-black: #000000;
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
      --card-radius: 16px;
      --menu-bg: #1a1f26;
      --text-color: #ffffff;
      --navbar-height: 60px;
      --footer-height: 80px;
    }

    body {
      background: var(--bg-black);
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
      padding-top: calc(var(--navbar-height) + 15px);
      padding-bottom: calc(var(--footer-height) + 20px);
    }

    /* Background Animation */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Navbar */
    .navbar {
      background: rgba(0, 0, 0, 0.3) !important;
      backdrop-filter: blur(12px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      z-index: 1030;
      height: var(--navbar-height);
    }

    .navbar-brand {
      color: var(--primary-color) !important;
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .header-logo { height: 28px; width: auto; border-radius: 5px; }

    /* Dropdown Menu */
    .dropdown-menu-custom {
      background-color: rgba(26, 31, 38, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 220px;
      position: absolute;
      right: 10px;
      top: 55px;
      display: none;
      z-index: 1050;
    }
    .dropdown-menu-custom.show { display: block; }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: #e0e0e0;
      text-decoration: none;
      transition: 0.3s;
    }
    .menu-item:hover { background: rgba(0, 240, 255, 0.1); color: var(--primary-color); }

    /* Video Player */
    .player-wrapper {
      background: #000;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: var(--glass-border);
      position: relative;
    }

    /* Watermark */
    .player-watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-color);
      opacity: 0.6;
      font-size: 0.7rem;
      font-weight: bold;
    }

    /* Action Buttons */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }
    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .btn-outline-custom {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      color: #ffffff;
      padding: 10px 5px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; font-size: 0.8rem; transition: 0.3s;
      cursor: pointer;
    }
    .btn-outline-custom:hover { border-color: var(--primary-color); color: var(--primary-color); background: rgba(0, 240, 255, 0.05); }
    .btn-full-width { grid-column: span 3; }

    /* --- NEW PREMIUM FOOTER STYLE --- */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1030;
      height: var(--footer-height);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dev-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 50px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none !important;
    }

    .dev-badge:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--primary-color);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      transform: translateY(-3px);
    }

    .dev-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid var(--primary-color);
      object-fit: cover;
      transition: 0.5s;
    }

    .dev-badge:hover .dev-avatar {
      transform: rotate(360deg);
    }

    .dev-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .dev-label {
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dev-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-color);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* Mobile Tweaks */
    @media (max-width: 768px) {
      .action-grid { grid-template-columns: repeat(3, 1fr); }
      .btn-outline-custom { font-size: 0.7rem; }
      .dev-badge { padding: 6px 15px; }
      .dev-name { font-size: 0.85rem; }
    }
  </style>
</head>

<body>
  <canvas id="particle-canvas"></canvas>

  <nav class="navbar navbar-dark fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand m-0" href="#">
        <img src="https://i.ibb.co.com/wZSFb93q/6233177219853388617.jpg" alt="Logo" class="header-logo">
        {{template_ne}}
      </a>
      <button class="navbar-toggler" type="button" onclick="toggleMenu(event)">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div id="customMenu" class="dropdown-menu-custom">
        <a href="https://t.me/+SUy4f5u0jB5lYzk9" target="_blank" class="menu-item"><i class="fa-solid fa-arrows-rotate me-2"></i> Update's</a>
        <a href="https://t.me/mineheartO" target="_blank" class="menu-item"><i class="fa-solid fa-envelope me-2"></i> Contact</a>
        <a href="https://t.me/+v3ssj9qdavVhNWQ9" target="_blank" class="menu-item"><i class="fa-solid fa-file-lines me-2"></i> Report</a>
        <a href="https://t.me/affanoiupload_bot" target="_blank" class="menu-item"><i class="fa-brands fa-telegram me-2"></i> Bot Link</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="player-wrapper">
      <div class="player-watermark" id="videoWatermark">
        <img src="https://i.ibb.co/Nn6x9Dhd/file-000000004c3071fa8a1196c3bdcf46d0.png" alt="Logo" style="height: 14px;">
        <span>{{template_ne}}</span>
      </div>
      <video id="myVideo" controls crossorigin playsinline>
        <source src="{{file_url}}" type="video/mp4" />
      </video>
    </div>

    <div class="glass-card">
      <div class="fw-bold mb-2"><i class="fa-solid fa-folder-open me-2 text-info"></i> File Info</div>
      <div class="small mb-1"><span class="text-info">Name:</span> {{file_name}}</div>
      <div class="small"><span class="text-info">Size:</span> {{file_size}}</div>
    </div>

    <div class="action-grid">
      <a onclick="copyLink()" class="btn-outline-custom"><i class="fa-regular fa-copy"></i> Copy</a>
      <a onclick="shareButton()" class="btn-outline-custom"><i class="fa-solid fa-share-nodes"></i> Share</a>
      <a onclick="triggerDownload()" class="btn-outline-custom"><i class="fa-solid fa-download"></i> Download</a>
      
      <a href="https://t.me/affanoiupload_bot" class="btn-outline-custom btn-full-width"><i class="fa-brands fa-telegram me-2"></i> Create Similar Link</a>

      <div class="btn-outline-custom btn-full-width" onclick="toggleExternal()">
        <i class="fa-solid fa-circle-play"></i> Play in External Player
      </div>
      <div id="extPlayers" style="display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; grid-column: span 3; margin-top: 10px;">
        <a onclick="vlc_player()" class="btn-outline-custom"><i class="fa-solid fa-play text-warning"></i> VLC</a>
        <a onclick="mx_player()" class="btn-outline-custom"><i class="fa-solid fa-video text-primary"></i> MX</a>
        <a onclick="playit_player()" class="btn-outline-custom"><i class="fa-solid fa-clapperboard text-success"></i> PlayIt</a>
      </div>
    </div>

    <div class="glass-card mb-4">
        <div class="fw-bold text-warning mb-1 small"><i class="fa-solid fa-triangle-exclamation me-1"></i> Disclaimer</div>
        <p style="font-size: 0.7rem; color: #aaa; margin: 0;">{{disclaimer}}</p>
    </div>
  </main>

  <!-- Final Enhanced Footer -->
  <footer>
    <a href="https://www.instagram.com/nova_jfrrr?igsh=MTdwM2YwNTVwNzV4cA==" target="_blank" class="dev-badge">
      <img src="https://i.ibb.co.com/wZSFb93q/6233177219853388617.jpg" alt="Dev" class="dev-avatar">
      <div class="dev-text">
        <span class="dev-label">Developed By</span>
        <span class="dev-name">Mr. Jaffer</span>
      </div>
      <i class="fa-brands fa-instagram ms-1" style="color: #ff4081; font-size: 1.1rem;"></i>
    </a>
  </footer>

  <script src="https://cdn.plyr.io/3.8.3/plyr.js"></script>
  <script>
    const player = new Plyr('#myVideo', {
      controls: ['progress', 'play-large', 'play', 'rewind', 'fast-forward', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
      seekTime: 10
    });

    function toggleMenu(e) { e.stopPropagation(); document.getElementById('customMenu').classList.toggle('show'); }
    window.onclick = () => document.getElementById('customMenu').classList.remove('show');
    
    function toggleExternal() {
      const el = document.getElementById('extPlayers');
      el.style.display = el.style.display === 'none' ? 'grid' : 'none';
    }

    function triggerDownload() {
      const a = document.createElement('a');
      a.href = "{{file_url}}";
      a.download = "{{file_name}}";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyLink() { navigator.clipboard.writeText(window.location.href); alert("Link Copied!"); }

    function shareButton() {
      if (navigator.share) {
        navigator.share({ title: '{{file_name}}', url: window.location.href });
      } else { copyLink(); }
    }

    // External Players
    const fileUrl = "{{file_url}}";
    function mx_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;scheme=https;end`; }
    function vlc_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;end`; }
    function playit_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=com.playit.videoplayer;type=video/*;scheme=https;end`; }

    // Particles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 1.5;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (let i = 0; i < 60; i++) particles.push(new Particle());
    function anim() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(anim);
    }
    anim();
  </script>
</body>
</html>
