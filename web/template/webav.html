<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Affanoi-Streaming | {{file_name}}</title>
  <link rel="icon" href="https://i.ibb.co.com/RTP9VpGS/6233177219853388617.jpg" type="image/x-icon" />
  <meta
    name="description"
    content="Stream high-quality videos and movies in 1080p. Experience seamless playback with multiple player options."
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- External CSS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  />
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.8.3/plyr.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://av-bo-tz.vercel.app/548/551/play.css" rel="stylesheet" />
</head>

<body class="bg-dark text-light">
  <div class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header
      class="bg-primary text-white py-2 shadow"
      style="background-color: {{ colours.header.background }} !important; color: {{ colours.header.color }} !important"
    >
      <div class="d-flex justify-content-between align-items-center container">
        <h1 class="h4 mb-0 fw-bold">{{template_ne}}</h1>
        <button id="theme-toggle-btn" class="btn btn-light theme-toggle-btn">
          <i class="fa-solid fa-sun"></i> Light Mode
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-grow-1 container py-3">
      <div class="player-wrapper mb-3">
        <video id="myVideo" src="{{file_url}}" class="w-100" controls crossorigin playsinline>
          Your browser does not support the video tag.
        </video>
        <!-- Plyr JS and Initialization -->
        <script src="https://cdn.plyr.io/3.8.3/plyr.js"></script>
        <script>
          const player = new Plyr('#myVideo', {
            controls: [
              'play-large', 'play', 'progress', 'current-time', 'mute',
              'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
            ]
          });
        </script>
      </div>

      <div
        class="d-flex justify-content-between mb-2 flex-wrap gap-2"
        style="gap: 0.5rem !important;"
      >
      </div>
      <div class="row g-3 mb-2">
        <div class="col-md-6">
          <a
            onclick="streamDownload()"
            class="btn btn-success w-100"
            style="border: none; background-color: {{ colours.download.background }}; color: {{ colours.download.color }}"
          >
            <i class="fa-solid fa-download me-2"></i> Download
          </a>
        </div>
      </div>

      <a
        id="tg_button"
        onclick="showLinkModal('https://t.me/affanoiupload_bot')"
        class="btn btn-warning w-100 mb-2"
        style="border: none; background-color: {{ colours.create_link.background }}; color: {{ colours.create_link.color }}"
      >
        <i class="fa-brands fa-telegram"></i> Create Like This Link
      </a>

      <a
        onclick="shareButton()"
        class="btn btn-danger w-100 mb-3"
        style="border: none; background-color: {{ colours.share.background }}; color: {{ colours.share.color }}"
      >
        <i class="fa fa-share-alt"></i> Share Now
      </a>

      <div
        class="card bg-dark text-light border-secondary mb-4"
        style="background-color: {{ colours.file_information.background }} !important; color: {{ colours.file_information.color }} !important"
      >
        <div class="card-header border-secondary">
          <h5 class="mb-0">
            <i class="fa-solid fa-circle-info me-2"></i> File Information
          </h5>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <p><strong>Name: </strong>{{file_name}}</p>
              <p><strong>Size: </strong>{{file_size}}</p>
            </div>
          </div>
        </div>
      </div>
      <div
        class="alert alert-warning"
        style="background-color: {{ colours.description.background }}; color: {{ colours.description.color }}"
      >
        <h6 class="fw-bold">
          <i class="fa-solid fa-triangle-exclamation me-2"></i> Disclaimer
        </h6>
        <p class="mb-0">{{disclaimer}}</p>
        <div class="button-container">
          <a href="{{report_link}}" class="report">Report</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- External Logic JS -->
  <script src="https://cdn.jsdelivr.net/gh/affanoiaibot-cmd/Affanoi.ai-tools@main/play.js"></script>
  <!-- Console log -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      console.log("JS Loaded Successfully");
    });
  </script>
</body>
</html>
