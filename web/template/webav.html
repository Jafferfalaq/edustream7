<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Player | {{file_name}}</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --app-bg: #0a0b10;
            --app-surface: #161823;
            --accent: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }

        body {
            background-color: var(--app-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-bottom: 80px; /* Space for Bottom Nav */
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- App Header --- */
        .app-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* --- Edge-to-Edge Player Section --- */
        .player-container {
            width: 100%;
            background: #000;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #artplayer {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        /* --- Content Layout --- */
        .app-content {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .video-meta {
            margin-bottom: 25px;
        }

        .video-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .badge-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .app-badge {
            background: var(--app-surface);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent);
            border: 1px solid rgba(0,210,255,0.2);
        }

        /* --- Smart Action Bar --- */
        .action-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: var(--app-surface);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
            color: var(--text-dim);
        }

        .action-item i {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .action-item span {
            font-size: 0.7rem;
            font-weight: 500;
        }

        .action-item.active i {
            color: var(--accent);
        }

        /* --- Horizontal List (Netflix Style) --- */
        .section-label {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .external-drawer {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .external-card {
            min-width: 100px;
            background: var(--app-surface);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .external-card i {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(22, 24, 35, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: var(--safe-area-inset-bottom);
            z-index: 1000;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-link.active {
            color: var(--accent);
        }

        .nav-link i {
            font-size: 1.2rem;
        }

        /* Utility classes */
        .text-accent { color: var(--accent); }

        /* Animation */
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-up {
            animation: slideUp 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="d-flex align-items-center gap-2">
            <div style="width: 32px; height: 32px; background: var(--accent-gradient); border-radius: 8px; display: grid; place-items: center;">
                <i class="fa-solid fa-play text-white fs-6"></i>
            </div>
            <span class="fw-bold tracking-tight">V-PLAYER PRO</span>
        </div>
        <div class="ms-auto">
            <i class="fa-solid fa-circle-user fs-4 opacity-50"></i>
        </div>
    </header>

    <!-- Native Player Area -->
    <div class="player-container">
        <div id="artplayer"></div>
    </div>

    <!-- Main Content -->
    <main class="app-content">
        <div class="video-meta animate-up">
            <h1 class="video-title">{{file_name}}</h1>
            <div class="badge-row">
                <span class="app-badge">1080p</span>
                <span class="app-badge">MP4</span>
                <span class="app-badge"><i class="fa-solid fa-bolt me-1"></i> Fast Stream</span>
            </div>
        </div>

        <!-- Logic Action Bar -->
        <div class="action-bar animate-up" style="animation-delay: 0.1s;">
            <button class="action-item" onclick="toggleWatchLater(this)">
                <i class="fa-regular fa-bookmark"></i>
                <span>Save</span>
            </button>
            <button class="action-item" onclick="shareVideo()">
                <i class="fa-solid fa-share"></i>
                <span>Share</span>
            </button>
            <button class="action-item" onclick="downloadVideo()">
                <i class="fa-solid fa-download text-accent"></i>
                <span class="text-accent">Download</span>
            </button>
            <button class="action-item" onclick="location.reload()">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh</span>
            </button>
        </div>

        <!-- External App Drawer -->
        <div class="animate-up" style="animation-delay: 0.2s;">
            <div class="section-label">
                <span>Play in External App</span>
                <span class="text-dim small">See All</span>
            </div>
            <div class="external-drawer">
                <div class="external-card" onclick="openIntents('vlc')">
                    <i class="fa-solid fa-orange fa-vlc" style="color: #ff8e0d;"></i>
                    <span>VLC</span>
                </div>
                <div class="external-card" onclick="openIntents('mx')">
                    <i class="fa-solid fa-play" style="color: #1a73e8;"></i>
                    <span>MX Player</span>
                </div>
                <div class="external-card" onclick="openIntents('playit')">
                    <i class="fa-solid fa-clapperboard" style="color: #00c853;"></i>
                    <span>PlayIt</span>
                </div>
                <div class="external-card" onclick="openIntents('km')">
                    <i class="fa-solid fa-compact-disc" style="color: #9c27b0;"></i>
                    <span>KM Player</span>
                </div>
            </div>
        </div>

        <!-- Description Section -->
        <div class="mt-4 animate-up" style="animation-delay: 0.3s;">
            <div class="section-label">Details</div>
            <div class="p-3 bg-dark rounded-3 small text-dim border border-secondary">
                <div class="d-flex justify-content-between mb-2">
                    <span>File Size:</span>
                    <span class="text-white">{{file_size}}</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Format:</span>
                    <span class="text-white">Video/MP4</span>
                </div>
                <hr class="my-2 opacity-10">
                <p class="mb-0" style="font-size: 0.7rem;">Note: Playback speed and quality settings are available in the player's gear icon.</p>
            </div>
        </div>
    </main>

    <!-- Bottom App Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-link active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fa-solid fa-compass"></i>
            <span>Explore</span>
        </a>
        <a href="#" class="nav-link" onclick="showHistory()">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script>
        const config = {
            url: "{{file_url}}",
            title: "{{file_name}}",
            size: "{{file_size}}"
        };

        // Initialize ArtPlayer (Native App Feel)
        const art = new ArtPlayer({
            container: '#artplayer',
            url: config.url,
            title: config.title,
            autoSize: true,
            fullscreen: true,
            fullscreenWeb: true,
            playbackRate: true,
            aspectRatio: true,
            setting: true,
            hotkey: true,
            pip: true,
            mutex: true,
            backdrop: true,
            playsInline: true,
            autoPlayback: true, // Auto-resume logic
            theme: '#00d2ff',
            icons: {
                loading: '<i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>',
                state: '<i class="fa-solid fa-play fa-2x"></i>',
            },
            settings: [
                {
                    html: 'Playback Speed',
                    width: 150,
                    selector: [
                        { html: '0.5x', value: 0.5 },
                        { html: 'Normal', value: 1, default: true },
                        { html: '1.5x', value: 1.5 },
                        { html: '2.0x', value: 2 },
                    ],
                    onSelect: (item) => art.playbackRate = item.value,
                }
            ],
            // Custom Player logic (Double tap to seek)
            plugins: [],
        });

        // Save to History Logic
        art.on('play', () => {
            let history = JSON.parse(localStorage.getItem('app_history') || '[]');
            const entry = { title: config.title, date: new Date().toLocaleDateString() };
            if(!history.find(h => h.title === entry.title)) {
                history.unshift(entry);
                localStorage.setItem('app_history', JSON.stringify(history.slice(0,10)));
            }
        });

        // App Functions
        function toggleWatchLater(btn) {
            const icon = btn.querySelector('i');
            icon.classList.toggle('fa-regular');
            icon.classList.toggle('fa-solid');
            icon.classList.toggle('text-accent');
            if(icon.classList.contains('fa-solid')) alert("Added to Saved Videos");
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({ title: config.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link Copied!");
            }
        }

        function downloadVideo() {
            const a = document.createElement('a');
            a.href = config.url;
            a.download = config.title;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openIntents(player) {
            const cleanUrl = config.url.replace(/^https?:\/\//, '');
            const intents = {
                vlc: `intent://${cleanUrl}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;end`,
                mx: `intent://${cleanUrl}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;scheme=https;end`,
                playit: `intent://${cleanUrl}#Intent;package=com.playit.videoplayer;type=video/*;scheme=https;end`,
                km: `intent://${cleanUrl}#Intent;package=com.kmplayer;type=video/*;scheme=https;end`
            };
            window.location.href = intents[player];
        }

        function showHistory() {
            const history = JSON.parse(localStorage.getItem('app_history') || '[]');
            alert("Last Played: " + (history[0]?.title || "No History"));
        }

        // Gesture Logic: Double Click to Forward/Backward
        let lastClick = 0;
        document.querySelector('#artplayer').addEventListener('touchstart', (e) => {
            const now = Date.now();
            if (now - lastClick < 300) {
                const rect = e.target.getBoundingClientRect();
                const x = e.touches[0].clientX - rect.left;
                if (x > rect.width / 2) {
                    art.seek = art.currentTime + 10;
                    art.notice.show = 'Forward 10s';
                } else {
                    art.seek = art.currentTime - 10;
                    art.notice.show = 'Backward 10s';
                }
            }
            lastClick = now;
        });
    </script>
</body>
</html>
