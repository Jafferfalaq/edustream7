  <style>
    :root {
      --primary-color: #00f0ff;
      --bg-black: #050505;
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
      --card-radius: 12px;
      --text-color: #ffffff;
      --navbar-height: 60px;
      --footer-height: 70px;
    }

    body {
      background: var(--bg-black);
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
      padding-top: calc(var(--navbar-height) + 10px);
      padding-bottom: calc(var(--footer-height) + 10px);
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.7) !important; 
      backdrop-filter: blur(15px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: var(--navbar-height);
    }

    .navbar-brand {
      color: var(--primary-color) !important;
      font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }

    .header-logo { height: 30px; width: auto; border-radius: 50%; }

    /* YouTube Style Player Wrapper */
    .player-container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* YouTube Ratio */
      background: #000;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: var(--glass-border);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Plyr UI Customization */
    .plyr--video { height: 100%; --plyr-color-main: var(--primary-color); }

    .player-watermark {
      position: absolute;
      top: 15px; right: 15px;
      z-index: 10;
      display: flex; align-items: center; gap: 6px;
      color: var(--primary-color);
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0.7;
      pointer-events: none;
    }

    .video-title { font-size: 1.2rem; font-weight: 600; margin-top: 15px; }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px; padding: 15px; margin-top: 15px;
    }

    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }

    .btn-custom {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px; color: #fff; padding: 10px;
      text-align: center; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; transition: 0.3s;
    }

    .btn-custom:hover { background: var(--primary-color); color: #000; }
    .btn-full { grid-column: span 3; }

    .external-players-container {
      grid-column: span 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      max-height: 0; overflow: hidden; transition: 0.4s ease;
    }
    .external-players-container.show { max-height: 100px; margin-top: 10px; }

    #loading-overlay {
      position: absolute; inset: 0; background: #000;
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }

    .dropdown-menu-custom {
      background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
      border-radius: 12px; border: var(--glass-border);
      position: absolute; right: 15px; top: 65px; display: none; min-width: 200px; z-index: 2000;
    }
    .dropdown-menu-custom.show { display: block; }
    .menu-item { padding: 12px 20px; color: #fff; text-decoration: none; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }

    footer {
      height: var(--footer-height); display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05);
      position: fixed; bottom: 0; width: 100%;
    }
  </style>
</head>

<body>
  <canvas id="particle-canvas"></canvas>

    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#">
        <img src="https://i.ibb.co.com/wZSFb93q/6233177219853388617.jpg" class="header-logo" alt="Logo">
        <span>{{template_ne}}</span>
      </a>
      <button class="navbar-toggler" style="border:none" onclick="toggleMenu(event)">
        <i class="fa-solid fa-bars-staggered"></i>
      </button>
      <div id="customMenu" class="dropdown-menu-custom">
        <a href="https://t.me/+SUy4f5u0jB5lYzk9" class="menu-item"><i class="fa-solid fa-arrows-rotate me-2"></i> Update'S</a>
        <a href="https://t.me/mineheartO" class="menu-item"><i class="fa-solid fa-envelope me-2"></i> Contact</a>
        <a href="https://t.me/+v3ssj9qdavVhNWQ9" class="menu-item"><i class="fa-solid fa-file-lines me-2"></i> Report</a>
        <a href="https://t.me/affanoiupload_bot" class="menu-item"><i class="fa-brands fa-telegram me-2"></i> Bot Link</a>
      </div>
    </div>
  </nav>

  <main class="container mt-2">
    <div class="player-container">
      <div class="player-wrapper shadow-lg">
        <div id="loading-overlay">
          <div class="spinner-border text-info" role="status"></div>
        </div>
        
        <div class="player-watermark">
          <img src="https://i.ibb.co/Nn6x9Dhd/file-000000004c3071fa8a1196c3bdcf46d0.png" height="14" alt="">
          <span>{{template_ne}}</span>
        </div>

        <!-- Video Element -->
        <video id="myVideo" crossorigin playsinline controls></video>
      </div>

      <div class="video-title">{{file_name}}</div>

      <div class="action-grid">
        <div onclick="copyLink()" class="btn-custom"><i class="fa-regular fa-copy"></i> Copy</div>
        <div onclick="shareButton()" class="btn-custom"><i class="fa-solid fa-share-nodes"></i> Share</div>
        <div onclick="triggerDownload()" class="btn-custom"><i class="fa-solid fa-download"></i> Save</div>
        
        <a href="https://t.me/affanoiupload_bot" class="btn-custom btn-full">
            <i class="fa-brands fa-telegram"></i> Create Your Own Link
        </a>

        <div class="btn-custom btn-full" onclick="toggleExternalPlayers()">
          <i class="fa-solid fa-circle-play"></i> External Player <i class="fa-solid fa-chevron-down ms-1" id="chevron"></i>
        </div>

        <div class="external-players-container" id="playerList">
          <div onclick="vlc_player()" class="btn-custom"><i class="fa-solid fa-play text-warning"></i> VLC</div>
          <div onclick="mx_player()" class="btn-custom"><i class="fa-solid fa-video text-primary"></i> MX</div>
          <div onclick="playit_player()" class="btn-custom"><i class="fa-solid fa-clapperboard text-success"></i> PlayIt</div>
        </div>

      <div class="glass-card">
        <div class="fw-bold mb-2 text-info small"><i class="fa-solid fa-info-circle me-1"></i> FILE INFO</div>
        <div class="small opacity-75">Size: {{file_size}}</div>
        <div class="small opacity-75">Stream: <span id="streamType">Detecting...</span></div>
      </div>

      <div class="glass-card mb-5">
          <div class="fw-bold text-warning mb-1 small">DISCLAIMER</div>

      </div>
    </div>

  <footer>
    <a href="https://www.instagram.com/nova_jfrrr?igsh=MTdwM2YwNTVwNzV4cA==" target="_blank" class="text-decoration-none" style="color: var(--primary-color)">
      <span class="small">Developed by Mr.Jaffer</span>
    </a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.8.3/plyr.js"></script>

  <script>
    const fileUrl = "{{file_url}}";
    const fileName = "{{file_name}}";
    const video = document.getElementById('myVideo');
    const loadingOverlay = document.getElementById('loading-overlay');
    
    // RESTORED ALL CONTROLS (pip, airplay, volume, rewind, etc)
    const player = new Plyr(video, {
      controls: ['play-large', 'play', 'rewind', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
      settings: ['quality', 'speed', 'captions'],
      quality: { 
        default: 0, 
        options: [0, 4320, 2160, 1440, 1080, 720, 576, 480, 360, 240],
        forced: true, 
        onChange: (q) => updateQuality(q) 
      }
    });

    // Auto Landscape on Fullscreen
    player.on('enterfullscreen', () => {
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }
    });

    if (fileUrl.includes('.m3u8')) {
      document.getElementById('streamType').innerText = "HLS (.m3u8)";
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(fileUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          const qualities = hls.levels.map(l => l.height);
          qualities.unshift(0); 
          player.config.quality.options = qualities;
          hideLoading();
        });
        window.hls = hls;
      }
    } else {
      document.getElementById('streamType').innerText = "Direct Video";
      video.src = fileUrl;
      video.onloadedmetadata = () => hideLoading();
    }

    function updateQuality(newQuality) {
      if (window.hls) {
        if (newQuality === 0) window.hls.currentLevel = -1;
        else {
          window.hls.levels.forEach((level, index) => {
            if (level.height === newQuality) window.hls.currentLevel = index;
          });
        }
      }
    }

    function hideLoading() {
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 500);
    }

    function toggleMenu(e) { e.stopPropagation(); document.getElementById('customMenu').classList.toggle('show'); }
    window.onclick = () => document.getElementById('customMenu').classList.remove('show');

    function toggleExternalPlayers() {
      const list = document.getElementById('playerList');
      const chev = document.getElementById('chevron');
      list.classList.toggle('show');
      chev.style.transform = list.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function triggerDownload() {
      const a = document.createElement('a'); a.href = fileUrl; a.download = fileName; a.target = "_blank";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function shareButton() {
      if (navigator.share) navigator.share({ title: fileName, url: window.location.href });
      else copyLink();
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    }

    function mx_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;scheme=https;end`; }
    function vlc_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;end`; }
    function playit_player() { window.location.href = `intent://${fileUrl.replace(/^https?:\/\//, '')}#Intent;package=com.playit.videoplayer;type=video/*;scheme=https;end`; }

    // Particles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 1.5;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (let i = 0; i < 70; i++) particles.push(new Particle());
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
